<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>分賬</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #081426;
        --surface: #10233f;
        --surface-2: #16304f;
        --ink: #eaf1fa;
        --ink-soft: #9db4d0;
        --line: #2a4568;
        --accent: #5b9bd5;
        --accent-ink: #081426;
        --accent-soft: #1d3a5f;
        --warn: #e8c87a;
        --warn-soft: #3a341e;
        --danger: #e89a94;
        --pos: #8fd0a8;
        --neg: #e89a94;
        --shadow: 0 1px 3px rgba(0,0,0,.45), 0 6px 18px rgba(0,0,0,.3);
        --radius: 8px;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans TC", "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
        font-size: 16px;
        line-height: 1.55;
      }
      button, select, input:not([type="checkbox"]) { min-height: 2.5rem; }
      button { font: inherit; cursor: pointer; }
      input, select { font: inherit; color: var(--ink); }
      .wrap { max-width: 680px; margin: 0 auto; padding: 16px 14px 40px; }

      header.hero { padding: 8px 2px 4px; }
      header.hero h1 { font-size: 24px; font-weight: 700; margin: 0; }
      .groupbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
      .groupbar .gname { font-weight: 700; }
      .groupbar .spacer { flex: 1; }

      section.card {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 16px; margin-top: 12px;
      }
      section.card > h2 { font-size: 19px; font-weight: 700; margin: 0 0 12px; }
      h3.sub { font-size: 15px; font-weight: 700; margin: 18px 0 8px; color: var(--ink-soft); }
      h3.sub:first-of-type { margin-top: 4px; }

      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      .row > * { flex: 1 1 160px; }
      .row > .grow-2 { flex-grow: 2; }
      label.field { display: block; margin-bottom: 12px; }
      label.field > span { display: block; font-size: 14px; font-weight: 700; margin-bottom: 5px; }
      input[type="text"], input[type="number"], input[type="date"], select {
        border-radius: 6px; width: 100%; padding: 10px 14px;
        border: 1px solid var(--line); background: var(--surface); min-height: 2.75rem;
      }
      input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      .btn {
        border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
        border-radius: 6px; padding: 9px 20px; font-weight: 700; min-height: 2.75rem;
      }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .btn.small { min-height: 2.25rem; padding: 5px 12px; font-size: 14px; }
      .btn.danger { color: var(--danger); }
      .btn:disabled { opacity: .45; cursor: not-allowed; }
      .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
      .chip {
        display: inline-flex; align-items: center; gap: 8px; background: var(--accent-soft);
        border-radius: 6px; padding: 6px 8px 6px 14px; font-weight: 700;
      }
      .chip button {
        border: none; background: transparent; color: var(--ink-soft); font-size: 18px; line-height: 1;
        width: 36px; height: 36px; border-radius: 999px; padding: 0;
      }
      .empty { color: var(--ink-soft); background: var(--surface-2); border-radius: 6px; padding: 14px 16px; font-size: 15px; }

      .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
      .seg button {
        flex: 1; border: none; background: var(--surface); color: var(--ink-soft);
        padding: 10px 4px; font-weight: 700; min-height: 2.75rem;
      }
      .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
      .seg button + button { border-left: 1px solid var(--line); }

      .plist { display: flex; flex-direction: column; gap: 6px; }
      .prow {
        display: flex; align-items: center; gap: 10px; border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 12px; min-height: 3rem; flex-wrap: wrap;
      }
      .prow label { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-height: 2.5rem; cursor: pointer; font-weight: 500; }
      .prow input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
      .prow .amt { flex: 0 1 150px; display: flex; align-items: center; gap: 6px; }
      .prow .amt input { min-height: 2.5rem; }
      .prow.off { opacity: .5; }
      .sumline { font-size: 14px; margin-top: 8px; color: var(--ink-soft); }
      .sumline.bad { color: var(--danger); font-weight: 700; }
      .sumline.ok { color: var(--pos); font-weight: 700; }

      .msg { border-radius: 6px; padding: 10px 14px; font-size: 14px; margin: 10px 0; display: none; }
      .msg.show { display: block; }
      .msg.err { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
      .msg.ok { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .pos { color: var(--pos); font-weight: 700; }
      .neg { color: var(--neg); font-weight: 700; }
      .zero { color: var(--ink-soft); }

      .transfer {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; margin-bottom: 8px;
        background: var(--surface-2);
      }
      .transfer .who { font-weight: 700; flex: 1 1 auto; }
      .transfer .amt-big { font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; }
      .arrow { color: var(--accent); font-weight: 900; }

      .item { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-bottom: 8px; }
      .item .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
      .item .desc { font-weight: 700; flex: 1 1 auto; }
      .item .amount { font-weight: 900; font-variant-numeric: tabular-nums; }
      .item .meta { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
      .item .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
      .totals { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
      .totals div b { display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
      .totals div span { font-size: 13px; color: var(--ink-soft); }

      .note { font-size: 13px; color: var(--ink-soft); margin: 8px 0 0; }
      .shot-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
      .shot-row input { flex: 1 1 auto; }
      #shotPreview { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; display: block; }

      @media (max-width: 560px) {
        .wrap { padding: 14px 12px 48px; }
        .prow .amt { flex: 1 1 120px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero"><h1>分賬</h1></header>

      <!-- 1. 群組 -->
      <section class="card" id="gateCard" aria-labelledby="h-gate">
        <h2 id="h-gate">群組</h2>
        <h3 class="sub">新建</h3>
        <label class="field" for="gateGroupName"><span>名稱</span>
          <input type="text" id="gateGroupName" placeholder="例如：旅行" autocomplete="off" />
        </label>
        <div class="row">
          <label class="field" for="gatePass1"><span>密碼 · 4位</span>
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" data-pin id="gatePass1" placeholder="1234" autocomplete="new-password" />
          </label>
          <label class="field" for="gatePass2"><span>再輸入</span>
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" data-pin id="gatePass2" placeholder="再輸入" autocomplete="new-password" />
          </label>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="createGroupBtn" type="button">建立</button>
        </div>
        <div class="msg" id="gateCreateMsg" role="status"></div>

        <h3 class="sub">用代碼加入</h3>
        <label class="field" for="joinCode"><span>代碼</span>
          <input type="text" id="joinCode" placeholder="貼上代碼" autocomplete="off" />
        </label>
        <label class="field" for="joinPass"><span>密碼 · 4位</span>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" data-pin id="joinPass" placeholder="1234" autocomplete="off" />
        </label>
        <div class="btn-row">
          <button class="btn primary" id="joinBtn" type="button">加入</button>
        </div>
        <div class="msg" id="joinMsg" role="status"></div>
      </section>

      <div id="appMain" style="display:none;">
        <div class="groupbar">
          <span class="gname" id="currentGroupName"></span>
          <span class="spacer"></span>
          <button class="btn small danger" id="resetBtn" type="button">新群組</button>
        </div>
        <div class="msg" id="appMsg" role="status"></div>

        <!-- 2. 成員 -->
        <section class="card" aria-labelledby="h-members">
          <h2 id="h-members">成員</h2>
          <div class="row">
            <label class="field grow-2" for="memberName" style="margin-bottom:0;"><span>名字</span>
              <input type="text" id="memberName" placeholder="輸入名字" autocomplete="off" />
            </label>
            <div style="display:flex;align-items:flex-end;">
              <button class="btn primary" id="addMemberBtn" type="button" style="width:100%;">新增</button>
            </div>
          </div>
          <div class="msg" id="memberMsg" role="status"></div>
          <div id="memberArea"></div>

          <h3 class="sub">截圖加入</h3>
          <input type="file" id="shotFile" accept="image/*" style="display:none;" />
          <div class="btn-row" style="margin-top:0;">
            <button class="btn" id="shotBtn" type="button">上載截圖加成員</button>
          </div>
          <div id="shotPreviewWrap" style="display:none;margin-top:10px;">
            <img id="shotPreview" alt="截圖預覽" />
          </div>
          <div class="msg" id="shotMsg" role="status"></div>
          <div id="shotEditor" style="display:none;">
            <div id="shotNames"></div>
            <div class="btn-row">
              <button class="btn small" id="shotAddRowBtn" type="button">加一行</button>
              <button class="btn primary" id="shotConfirmBtn" type="button">確認加入</button>
              <button class="btn" id="shotCancelBtn" type="button">取消</button>
            </div>
          </div>
        </section>

        <!-- 3. 新增支出 -->
        <section class="card" aria-labelledby="h-expense">
          <h2 id="h-expense">新增支出</h2>
          <div class="msg" id="expenseMsg" role="status"></div>
          <div class="row">
            <label class="field grow-2" for="expDesc"><span>項目</span>
              <input type="text" id="expDesc" placeholder="例如：晚餐" autocomplete="off" />
            </label>
            <label class="field" for="expAmount"><span>金額 HK$</span>
              <input type="number" id="expAmount" inputmode="decimal" min="0" step="0.01" placeholder="0.00" />
            </label>
          </div>
          <div class="row">
            <label class="field" for="expPayer"><span>付款人</span>
              <select id="expPayer"></select>
            </label>
            <label class="field" for="expDate"><span>日期</span>
              <input type="date" id="expDate" />
            </label>
          </div>
          <span style="display:block;font-size:14px;font-weight:700;margin-bottom:5px;">分法</span>
          <div class="seg" role="group" aria-label="分法">
            <button type="button" data-mode="equal" aria-pressed="true">平均</button>
            <button type="button" data-mode="custom" aria-pressed="false">自訂金額</button>
          </div>
          <div class="btn-row" style="margin:0 0 8px;">
            <button class="btn small" type="button" id="selectAllBtn">全選</button>
            <button class="btn small" type="button" id="selectNoneBtn">取消全選</button>
          </div>
          <div class="plist" id="participantList"></div>
          <div class="sumline" id="splitSum"></div>
          <div class="btn-row">
            <button class="btn primary" id="saveExpenseBtn" type="button">新增支出</button>
            <button class="btn" id="cancelEditBtn" type="button" style="display:none;">取消修改</button>
          </div>
        </section>

        <!-- 4. 結算 -->
        <section class="card" aria-labelledby="h-settle">
          <h2 id="h-settle">結算</h2>
          <div class="totals">
            <div><b id="totalSpent">HK$0.00</b><span>總支出</span></div>
            <div><b id="expenseCount">0</b><span>筆數</span></div>
            <div><b id="memberCount">0</b><span>成員</span></div>
          </div>
          <div id="balanceArea"></div>
          <h3 class="sub">點還</h3>
          <div id="transferArea"></div>
          <div class="btn-row">
            <button class="btn primary" id="copySummaryBtn" type="button">複製結算</button>
          </div>
          <div class="msg" id="copyMsg" role="status"></div>
        </section>

        <!-- 支出紀錄 -->
        <section class="card" aria-labelledby="h-expenses">
          <h2 id="h-expenses">支出</h2>
          <div id="expenseList"></div>
        </section>

        <!-- 5. 分享 -->
        <section class="card" aria-labelledby="h-share">
          <h2 id="h-share">分享</h2>
          <div class="btn-row">
            <button class="btn primary" id="shareInviteBtn" type="button">複製邀請</button>
          </div>
          <div class="msg" id="shareMsg" role="status"></div>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
    <script>
    (function () {
      "use strict";

      var state = { group: null, members: [], expenses: [] };
      var splitMode = "equal";
      var editingExpenseId = null;
      var uidCounter = 1;

      function uid() { return "id" + (uidCounter++) + "_" + Date.now().toString(36); }
      function $(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function toCents(v) { var n = parseFloat(v); return isNaN(n) ? null : Math.round(n * 100); }
      function fmt(cents) {
        var sign = cents < 0 ? "-" : "";
        var abs = Math.abs(cents);
        var dollars = Math.floor(abs / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        var c = ("0" + (abs % 100)).slice(-2);
        return sign + "HK$" + dollars + "." + c;
      }
      function fmtPlain(cents) { return (cents / 100).toFixed(2); }
      function memberById(id) {
        for (var i = 0; i < state.members.length; i++) if (state.members[i].id === id) return state.members[i];
        return null;
      }
      function memberName(id) { var m = memberById(id); return m ? m.name : "（已移除）"; }
      function showMsg(el, text, kind) {
        el.textContent = text;
        el.className = "msg show " + (kind || "");
        if (kind === "ok") setTimeout(function () { el.className = "msg"; }, 4000);
      }
      function todayStr() {
        var d = new Date();
        var m = ("0" + (d.getMonth() + 1)).slice(-2), day = ("0" + d.getDate()).slice(-2);
        return d.getFullYear() + "-" + m + "-" + day;
      }
      function hashPass(str) {
        var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
        for (var i = 0, ch; i < str.length; i++) {
          ch = str.charCodeAt(i);
          h1 = Math.imul(h1 ^ ch, 2654435761);
          h2 = Math.imul(h2 ^ ch, 1597334677);
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
      }

      // ---------- 群組 ----------
      function showApp() {
        $("gateCard").style.display = "none";
        $("appMain").style.display = "";
        renderMembers();
      }
      function showGate() {
        $("gateCard").style.display = "";
        $("appMain").style.display = "none";
      }
      function createGroup() {
        var msg = $("gateCreateMsg");
        var name = $("gateGroupName").value.trim();
        var p1 = $("gatePass1").value, p2 = $("gatePass2").value;
        if (!name) { showMsg(msg, "請輸入名稱。", "err"); return; }
        if (!/^\d{4}$/.test(p1)) { showMsg(msg, "密碼須為 4 位數字。", "err"); return; }
        if (p1 !== p2) { showMsg(msg, "兩次密碼不一致。", "err"); return; }
        state = { group: { name: name, passHash: hashPass(p1), pass: p1 }, members: [], expenses: [] };
        $("gatePass1").value = ""; $("gatePass2").value = "";
        showApp();
      }
      function resetGroup() {
        var btn = $("resetBtn");
        if (btn.getAttribute("data-confirm") === "1") {
          state = { group: null, members: [], expenses: [] };
          editingExpenseId = null;
          splitMode = "equal";
          document.querySelectorAll(".seg button").forEach(function (b) {
            b.setAttribute("aria-pressed", b.getAttribute("data-mode") === "equal" ? "true" : "false");
          });
          btn.removeAttribute("data-confirm");
          btn.textContent = "新群組";
          showGate();
        } else {
          btn.setAttribute("data-confirm", "1");
          btn.textContent = "確認清除？";
          setTimeout(function () { btn.removeAttribute("data-confirm"); btn.textContent = "新群組"; }, 4000);
        }
      }

      // ---------- 分享代碼 ----------
      function makeShareCode() {
        if (!state.group) return "";
        var payload = JSON.stringify({ n: state.group.name, h: state.group.passHash });
        var b64 = btoa(unescape(encodeURIComponent(payload)))
          .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        return "FZ-" + b64.replace(/(.{4})/g, "$1 ").trim();
      }
      function parseShareCode(raw) {
        try {
          var s = String(raw || "").trim().replace(/^FZ-?/i, "").replace(/\s+/g, "");
          s = s.replace(/-/g, "+").replace(/_/g, "/");
          while (s.length % 4) s += "=";
          var d = JSON.parse(decodeURIComponent(escape(atob(s))));
          if (!d || typeof d.n !== "string" || !d.n) return null;
          return { n: d.n, h: typeof d.h === "string" ? d.h : null };
        } catch (e) { return null; }
      }
      function joinWithCode() {
        var msg = $("joinMsg");
        var data = parseShareCode($("joinCode").value);
        if (!data) { showMsg(msg, "代碼不正確。", "err"); return; }
        var joinPassVal = $("joinPass").value;
        if (data.h) {
          if (!/^\d{4}$/.test(joinPassVal) || hashPass(joinPassVal) !== data.h) {
            showMsg(msg, "密碼不正確。", "err");
            return;
          }
        }
        state = { group: { name: data.n, passHash: data.h, pass: data.h ? joinPassVal : null }, members: [], expenses: [] };
        showApp();
      }
      function copyText(text, okText, msgEl) {
        function done() { showMsg(msgEl, okText, "ok"); }
        function fallback() {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); done(); }
          catch (e) { showMsg(msgEl, "複製失敗，請長按手動複製。", "err"); }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, fallback);
        } else { fallback(); }
      }
      function shareInvite() {
        var msg = $("shareMsg");
        if (!state.group) return;
        var p = state.group.pass ? String(state.group.pass) : "";
        var link = buildShareLink(p || null);
        var text = "分賬群組「" + state.group.name + "」\n邀請連結：" + link + "\n代碼：" + makeShareCode() + (p ? "\n密碼：" + p : "");
        copyText(text, "邀請已複製。", msg);
      }

      // ---------- 分享連結（自動進入） ----------
      function b64Encode(str) {
        return btoa(unescape(encodeURIComponent(str)))
          .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }
      function b64Decode(s) {
        s = String(s || "").replace(/-/g, "+").replace(/_/g, "/");
        while (s.length % 4) s += "=";
        return decodeURIComponent(escape(atob(s)));
      }
      function buildShareLink(pass) {
        var payload = JSON.stringify({
          n: state.group.name,
          h: state.group.passHash,
          p: pass,
          m: state.members.map(function (m) { return m.name; })
        });
        var base = location.href.split("#")[0].split("?")[0];
        return base + "#g=" + b64Encode(payload);
      }
      function copyShareLink() {
        var msg = $("shareMsg");
        if (!state.group) return;
        var p = state.group.pass ? String(state.group.pass) : null;
        copyText(buildShareLink(p), "連結已複製。", msg);
      }
      function importFromLink() {
        if (!location.hash || location.hash.indexOf("#g=") !== 0) return false;
        try {
          var d = JSON.parse(b64Decode(location.hash.slice(3)));
          if (!d || typeof d.n !== "string" || !d.n) return false;
          var h = typeof d.h === "string" && d.h ? d.h
            : (d.p && /^\d{4}$/.test(String(d.p)) ? hashPass(String(d.p)) : null);
          state = { group: { name: d.n, passHash: h, pass: d.p && /^\d{4}$/.test(String(d.p)) ? String(d.p) : null }, members: [], expenses: [] };
          if (Array.isArray(d.m)) {
            var seen = {};
            d.m.forEach(function (nm) {
              nm = String(nm == null ? "" : nm).trim();
              if (nm && !seen[nm]) { seen[nm] = 1; state.members.push({ id: uid(), name: nm }); }
            });
          }
          if (window.history && history.replaceState) {
            history.replaceState(null, "", location.href.split("#")[0]);
          }
          showApp();
          showMsg($("appMsg"), "已加入群組「" + d.n + "」。", "ok");
          return true;
        } catch (e) { return false; }
      }

      // ---------- 成員 ----------
      function renderMembers() {
        var area = $("memberArea");
        if (!state.members.length) {
          area.innerHTML = '<div class="empty">未有成員</div>';
        } else {
          var html = '<div class="chips">';
          state.members.forEach(function (m) {
            html += '<span class="chip">' + esc(m.name) +
              '<button type="button" data-remove-member="' + m.id + '" aria-label="移除 ' + esc(m.name) + '">×</button></span>';
          });
          html += "</div>";
          area.innerHTML = html;
        }
        renderPayerSelect();
        renderParticipants(null);
        renderAll();
      }
      function renderPayerSelect() {
        var sel = $("expPayer"), prev = sel.value;
        var opts = state.members.map(function (m) {
          return '<option value="' + m.id + '">' + esc(m.name) + "</option>";
        }).join("");
        sel.innerHTML = state.members.length ? opts : '<option value="">（未有成員）</option>';
        if (prev && memberById(prev)) sel.value = prev;
      }
      function addMember() {
        var input = $("memberName");
        var name = input.value.trim();
        if (!name) { showMsg($("memberMsg"), "請輸入名字。", "err"); return; }
        for (var i = 0; i < state.members.length; i++) {
          if (state.members[i].name === name) { showMsg($("memberMsg"), "「" + name + "」已存在。", "err"); return; }
        }
        state.members.push({ id: uid(), name: name });
        input.value = "";
        input.focus();
        renderMembers();
      }
      function removeMember(id) {
        var used = state.expenses.some(function (e) {
          return e.payerId === id || Object.prototype.hasOwnProperty.call(e.shares, id);
        });
        if (used) {
          showMsg($("memberMsg"), "「" + memberName(id) + "」已有支出紀錄，不可移除。", "err");
          return;
        }
        state.members = state.members.filter(function (m) { return m.id !== id; });
        renderMembers();
      }

      // ---------- 截圖辨識成員 ----------
      function setShotMsg(text) {
        var el = $("shotMsg");
        el.textContent = text;
        el.className = text ? "msg show" : "msg";
      }
      function addShotRow(name) {
        var row = document.createElement("div");
        row.className = "shot-row";
        var inp = document.createElement("input");
        inp.type = "text";
        inp.value = name || "";
        inp.placeholder = "名字";
        inp.setAttribute("data-shot-name", "");
        inp.setAttribute("autocomplete", "off");
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn small";
        btn.textContent = "移除";
        btn.addEventListener("click", function () {
          if (row.parentNode) row.parentNode.removeChild(row);
        });
        row.appendChild(inp);
        row.appendChild(btn);
        $("shotNames").appendChild(row);
      }
      function extractNames(text) {
        var out = [], seen = {};
        var bad = /接力|edited|online|typing|今日|昨天|訊息|未讀|群組|成員/i;
        function push(c) {
          c = String(c || "").replace(/^[^一-鿿A-Za-z]+/, "").replace(/[\s·•・]+$/, "").trim();
          if (c.length < 2 || c.length > 24) return;
          if (/[\d$=\/+×:：]/.test(c)) return;
          if (bad.test(c)) return;
          if (!/^[一-鿿A-Za-z][一-鿿A-Za-z0-9 _\-]*$/.test(c)) return;
          if (seen[c]) return;
          seen[c] = 1;
          out.push(c);
        }
        String(text || "").split(/\r?\n/).forEach(function (line) {
          line = line.trim();
          if (!line) return;
          var idx = line.search(/[:：]/);
          if (idx > 0) push(line.slice(0, idx));
          else push(line);
        });
        return out;
      }
      function showShotEditor(names) {
        $("shotNames").innerHTML = "";
        names.forEach(function (n) { addShotRow(n); });
        if (!names.length) addShotRow("");
        $("shotEditor").style.display = "";
      }
      function onShotFile() {
        var input = $("shotFile");
        var f = input.files && input.files[0];
        input.value = "";
        if (!f) return;
        var url = URL.createObjectURL(f);
        $("shotPreview").src = url;
        $("shotPreviewWrap").style.display = "";
        $("shotEditor").style.display = "none";
        setShotMsg("辨識中…");
        if (typeof Tesseract === "undefined") { shotOcrFail(); return; }
        Tesseract.recognize(url, "chi_tra+eng").then(function (res) {
          var names = extractNames(res && res.data ? res.data.text : "");
          if (names.length) {
            setShotMsg("");
            showMsg($("shotMsg"), "辨識到 " + names.length + " 個名字，請核對後確認。", "ok");
          } else {
            showMsg($("shotMsg"), "未能辨識名字，請手動輸入。", "err");
          }
          showShotEditor(names);
        }).catch(function () { shotOcrFail(); });
      }
      function shotOcrFail() {
        showMsg($("shotMsg"), "辨識失敗，請手動輸入。", "err");
        showShotEditor([]);
      }
      function confirmShotNames() {
        var inputs = document.querySelectorAll("[data-shot-name]");
        var added = 0;
        for (var i = 0; i < inputs.length; i++) {
          var name = inputs[i].value.trim();
          if (!name) continue;
          var dup = state.members.some(function (m) { return m.name === name; });
          if (dup) continue;
          state.members.push({ id: uid(), name: name });
          added++;
        }
        $("shotEditor").style.display = "none";
        $("shotNames").innerHTML = "";
        setShotMsg("");
        if (added) showMsg($("memberMsg"), "已加入 " + added + " 位成員。", "ok");
        else showMsg($("memberMsg"), "未有新成員加入。", "err");
        renderMembers();
      }

      // ---------- 分攤 ----------
      function renderParticipants(preset) {
        var list = $("participantList");
        if (!state.members.length) {
          list.innerHTML = '<div class="empty">未有成員</div>';
          updateSplitSum();
          return;
        }
        var html = "";
        state.members.forEach(function (m) {
          var checked = true, val = "";
          if (preset && preset.shares) {
            checked = Object.prototype.hasOwnProperty.call(preset.shares, m.id);
            if (checked && splitMode === "custom") val = fmtPlain(preset.shares[m.id]);
          }
          html += '<div class="prow' + (checked ? "" : " off") + '" data-row="' + m.id + '">' +
            '<label><input type="checkbox" data-part="' + m.id + '"' + (checked ? " checked" : "") + " /> " + esc(m.name) + "</label>";
          if (splitMode === "custom") {
            html += '<span class="amt">HK$ <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" data-amt="' + m.id + '" value="' + esc(val) + '"' + (checked ? "" : " disabled") + " /></span>";
          }
          html += "</div>";
        });
        list.innerHTML = html;
        updateSplitSum();
      }
      function selectedParticipants() {
        var out = [];
        var boxes = document.querySelectorAll("[data-part]");
        for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) out.push(boxes[i].getAttribute("data-part"));
        return out;
      }
      function updateSplitSum() {
        var el = $("splitSum");
        var total = toCents($("expAmount").value);
        var parts = selectedParticipants();
        if (splitMode === "equal") {
          el.className = "sumline";
          el.textContent = parts.length
            ? parts.length + " 人分攤" + (total != null && total > 0 ? "，每人 " + fmt(Math.round(total / parts.length)) : "")
            : "未選成員。";
          return;
        }
        var sum = 0, ok = true;
        parts.forEach(function (id) {
          var inp = document.querySelector('[data-amt="' + id + '"]');
          var v = inp ? parseFloat(inp.value) : NaN;
          if (isNaN(v)) { ok = false; return; }
          sum += Math.round(v * 100);
        });
        if (total == null) { el.className = "sumline"; el.textContent = "請先輸入金額。"; return; }
        var diff = total - sum;
        el.className = "sumline " + (ok && diff === 0 ? "ok" : "bad");
        el.textContent = !parts.length ? "未選成員。"
          : !ok ? "尚有金額未填。"
          : diff === 0 ? "合計 " + fmt(sum) + " ✓"
          : "合計 " + fmt(sum) + "，相差 " + fmt(Math.abs(diff)) + "。";
      }
      function computeShares(totalCents, parts) {
        var shares = {};
        if (splitMode === "equal") {
          var base = Math.floor(totalCents / parts.length);
          var rem = totalCents - base * parts.length;
          parts.forEach(function (id, i) { shares[id] = base + (i < rem ? 1 : 0); });
        } else {
          parts.forEach(function (id) {
            var inp = document.querySelector('[data-amt="' + id + '"]');
            shares[id] = Math.round(parseFloat(inp.value) * 100);
          });
        }
        return shares;
      }

      // ---------- 支出 ----------
      function saveExpense() {
        var msg = $("expenseMsg");
        var desc = $("expDesc").value.trim();
        var total = toCents($("expAmount").value);
        var payerId = $("expPayer").value;
        var parts = selectedParticipants();
        if (!state.members.length) { showMsg(msg, "請先新增成員。", "err"); return; }
        if (!desc) { showMsg(msg, "請輸入項目。", "err"); return; }
        if (total == null || total <= 0) { showMsg(msg, "金額不正確。", "err"); return; }
        if (!payerId || !memberById(payerId)) { showMsg(msg, "請選付款人。", "err"); return; }
        if (!parts.length) { showMsg(msg, "請選分攤成員。", "err"); return; }
        if (splitMode === "custom") {
          var sum = 0, bad = false;
          parts.forEach(function (id) {
            var inp = document.querySelector('[data-amt="' + id + '"]');
            var v = inp ? parseFloat(inp.value) : NaN;
            if (isNaN(v) || v < 0) bad = true; else sum += Math.round(v * 100);
          });
          if (bad) { showMsg(msg, "尚有金額未填。", "err"); return; }
          if (sum !== total) { showMsg(msg, "自訂合計須等於總額，相差 " + fmt(Math.abs(total - sum)) + "。", "err"); return; }
        }
        var record = {
          id: editingExpenseId || uid(),
          desc: desc,
          amountCents: total,
          payerId: payerId,
          date: $("expDate").value || todayStr(),
          mode: splitMode,
          shares: computeShares(total, parts)
        };
        if (editingExpenseId) {
          for (var i = 0; i < state.expenses.length; i++) {
            if (state.expenses[i].id === editingExpenseId) state.expenses[i] = record;
          }
          showMsg(msg, "已儲存。", "ok");
        } else {
          state.expenses.push(record);
          showMsg(msg, "已新增。", "ok");
        }
        cancelEdit(true);
        renderAll();
      }
      function startEdit(id) {
        var e = null;
        state.expenses.forEach(function (x) { if (x.id === id) e = x; });
        if (!e) return;
        editingExpenseId = id;
        splitMode = e.mode;
        document.querySelectorAll(".seg button").forEach(function (b) {
          b.setAttribute("aria-pressed", b.getAttribute("data-mode") === splitMode ? "true" : "false");
        });
        $("expDesc").value = e.desc;
        $("expAmount").value = fmtPlain(e.amountCents);
        $("expPayer").value = e.payerId;
        $("expDate").value = e.date;
        $("saveExpenseBtn").textContent = "儲存修改";
        $("cancelEditBtn").style.display = "";
        $("h-expense").textContent = "修改支出";
        renderParticipants(e);
        window.scrollTo({ top: $("h-expense").offsetTop - 16, behavior: "smooth" });
      }
      function cancelEdit(keepMsg) {
        editingExpenseId = null;
        $("expDesc").value = "";
        $("expAmount").value = "";
        $("expDate").value = todayStr();
        $("saveExpenseBtn").textContent = "新增支出";
        $("cancelEditBtn").style.display = "none";
        $("h-expense").textContent = "新增支出";
        if (!keepMsg) $("expenseMsg").className = "msg";
        renderParticipants(null);
      }
      function deleteExpense(id) {
        state.expenses = state.expenses.filter(function (e) { return e.id !== id; });
        if (editingExpenseId === id) cancelEdit(true);
        renderAll();
      }

      // ---------- 結算 ----------
      function computeBalances() {
        var bal = {};
        state.members.forEach(function (m) { bal[m.id] = 0; });
        state.expenses.forEach(function (e) {
          if (bal[e.payerId] != null) bal[e.payerId] += e.amountCents;
          Object.keys(e.shares).forEach(function (id) { if (bal[id] != null) bal[id] -= e.shares[id]; });
        });
        return bal;
      }
      function computeTransfers(bal) {
        var debtors = [], creditors = [];
        Object.keys(bal).forEach(function (id) {
          if (bal[id] < 0) debtors.push({ id: id, amt: -bal[id] });
          else if (bal[id] > 0) creditors.push({ id: id, amt: bal[id] });
        });
        debtors.sort(function (a, b) { return b.amt - a.amt; });
        creditors.sort(function (a, b) { return b.amt - a.amt; });
        var transfers = [], i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          var pay = Math.min(debtors[i].amt, creditors[j].amt);
          if (pay > 0) transfers.push({ fromId: debtors[i].id, toId: creditors[j].id, amountCents: pay });
          debtors[i].amt -= pay; creditors[j].amt -= pay;
          if (debtors[i].amt === 0) i++;
          if (creditors[j].amt === 0) j++;
        }
        return transfers;
      }
      function modeLabel(mode) { return mode === "equal" ? "平均" : "自訂"; }

      function renderAll() {
        if (!state.group) return;
        var total = state.expenses.reduce(function (s, e) { return s + e.amountCents; }, 0);
        $("totalSpent").textContent = fmt(total);
        $("expenseCount").textContent = state.expenses.length;
        $("memberCount").textContent = state.members.length;
        $("currentGroupName").textContent = state.group.name;

        var bal = computeBalances();
        var bArea = $("balanceArea");
        if (!state.members.length) {
          bArea.innerHTML = '<div class="empty">未有結餘</div>';
        } else {
          var rows = state.members.map(function (m) {
            var v = bal[m.id];
            var cls = v > 0 ? "pos" : v < 0 ? "neg" : "zero";
            var label = v > 0 ? "應收 " + fmt(v) : v < 0 ? "應付 " + fmt(-v) : "已結清";
            return "<tr><td>" + esc(m.name) + '</td><td class="num ' + cls + '">' + label + "</td></tr>";
          }).join("");
          bArea.innerHTML = "<table><thead><tr><th>成員</th><th class='num'>結餘</th></tr></thead><tbody>" + rows + "</tbody></table>";
        }

        var transfers = computeTransfers(bal);
        var tArea = $("transferArea");
        if (!transfers.length) {
          tArea.innerHTML = '<div class="empty">' + (state.expenses.length ? "已結清" : "尚無支出") + "</div>";
        } else {
          tArea.innerHTML = transfers.map(function (t) {
            return '<div class="transfer"><span class="who">' + esc(memberName(t.fromId)) +
              ' <span class="arrow">→</span> ' + esc(memberName(t.toId)) + '</span>' +
              '<span class="amt-big">' + fmt(t.amountCents) + "</span></div>";
          }).join("");
        }

        var eArea = $("expenseList");
        if (!state.expenses.length) {
          eArea.innerHTML = '<div class="empty">尚無支出</div>';
        } else {
          var sorted = state.expenses.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
          eArea.innerHTML = sorted.map(function (e) {
            var shareNames = Object.keys(e.shares).map(function (id) { return memberName(id); }).join("、");
            return '<div class="item"><div class="top"><span class="desc">' + esc(e.desc) + '</span>' +
              '<span class="amount">' + fmt(e.amountCents) + "</span></div>" +
              '<div class="meta">' + esc(e.date) + " · " + esc(memberName(e.payerId)) + " 付款 · " +
              modeLabel(e.mode) + "（" + esc(shareNames) + "）</div>" +
              '<div class="actions"><button class="btn small" type="button" data-edit="' + e.id + '">修改</button>' +
              '<button class="btn small danger" type="button" data-del-exp="' + e.id + '">刪除</button></div></div>';
          }).join("");
        }
      }

      function buildSummary() {
        var bal = computeBalances();
        var transfers = computeTransfers(bal);
        var total = state.expenses.reduce(function (s, e) { return s + e.amountCents; }, 0);
        var lines = [];
        lines.push("分賬結算 — 「" + state.group.name + "」");
        lines.push("總支出：" + fmt(total) + "（" + state.expenses.length + " 筆）");
        lines.push("");
        state.members.forEach(function (m) {
          var v = bal[m.id];
          lines.push("・" + m.name + "：" + (v > 0 ? "應收 " + fmt(v) : v < 0 ? "應付 " + fmt(-v) : "已結清"));
        });
        if (transfers.length) {
          lines.push("");
          lines.push("點還：");
          transfers.forEach(function (t) {
            lines.push("・" + memberName(t.fromId) + " → " + memberName(t.toId) + "：" + fmt(t.amountCents));
          });
        }
        return lines.join("\n");
      }
      function copySummary() {
        var msg = $("copyMsg");
        if (!state.expenses.length) { showMsg(msg, "尚無支出。", "err"); return; }
        copyText(buildSummary(), "結算已複製。", msg);
      }

      // ---------- Events ----------
      document.addEventListener("click", function (ev) {
        var t = ev.target;
        function closest(attr) {
          var n = t;
          while (n && n !== document) { if (n.getAttribute && n.getAttribute(attr)) return n; n = n.parentNode; }
          return null;
        }
        var rm = closest("data-remove-member"); if (rm) { removeMember(rm.getAttribute("data-remove-member")); return; }
        var ed = closest("data-edit"); if (ed) { startEdit(ed.getAttribute("data-edit")); return; }
        var de = closest("data-del-exp"); if (de) { deleteExpense(de.getAttribute("data-del-exp")); return; }
      });
      document.addEventListener("change", function (ev) {
        var t = ev.target;
        if (t.getAttribute && t.getAttribute("data-part")) {
          var row = t.closest ? t.closest(".prow") : null;
          if (row) {
            row.classList.toggle("off", !t.checked);
            var inp = row.querySelector("[data-amt]");
            if (inp) inp.disabled = !t.checked;
          }
          updateSplitSum();
        }
      });
      document.addEventListener("input", function (ev) {
        var t = ev.target;
        if (!t.getAttribute) return;
        if (t.getAttribute("data-pin") != null) {
          var v = t.value.replace(/\D/g, "").slice(0, 4);
          if (v !== t.value) t.value = v;
        }
        if (t.id === "expAmount" || t.getAttribute("data-amt")) updateSplitSum();
      });
      document.querySelectorAll(".seg button").forEach(function (b) {
        b.addEventListener("click", function () {
          splitMode = b.getAttribute("data-mode");
          document.querySelectorAll(".seg button").forEach(function (x) {
            x.setAttribute("aria-pressed", x === b ? "true" : "false");
          });
          renderParticipants(null);
        });
      });

      $("createGroupBtn").addEventListener("click", createGroup);
      $("gatePass2").addEventListener("keydown", function (ev) { if (ev.key === "Enter") createGroup(); });
      $("joinBtn").addEventListener("click", joinWithCode);
      $("joinPass").addEventListener("keydown", function (ev) { if (ev.key === "Enter") joinWithCode(); });
      $("resetBtn").addEventListener("click", resetGroup);

      $("addMemberBtn").addEventListener("click", addMember);
      $("memberName").addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); addMember(); } });
      $("saveExpenseBtn").addEventListener("click", saveExpense);
      $("cancelEditBtn").addEventListener("click", function () { cancelEdit(); });
      $("selectAllBtn").addEventListener("click", function () {
        document.querySelectorAll("[data-part]").forEach(function (b) {
          b.checked = true;
          var row = b.closest(".prow"); if (row) { row.classList.remove("off"); var inp = row.querySelector("[data-amt]"); if (inp) inp.disabled = false; }
        });
        updateSplitSum();
      });
      $("selectNoneBtn").addEventListener("click", function () {
        document.querySelectorAll("[data-part]").forEach(function (b) {
          b.checked = false;
          var row = b.closest(".prow"); if (row) { row.classList.add("off"); var inp = row.querySelector("[data-amt]"); if (inp) inp.disabled = true; }
        });
        updateSplitSum();
      });

      $("copySummaryBtn").addEventListener("click", copySummary);
      $("shareInviteBtn").addEventListener("click", shareInvite);

      $("shotBtn").addEventListener("click", function () { $("shotFile").click(); });
      $("shotFile").addEventListener("change", onShotFile);
      $("shotAddRowBtn").addEventListener("click", function () { addShotRow(""); });
      $("shotConfirmBtn").addEventListener("click", confirmShotNames);
      $("shotCancelBtn").addEventListener("click", function () {
        $("shotEditor").style.display = "none";
        $("shotNames").innerHTML = "";
        setShotMsg("");
      });

      $("expDate").value = todayStr();
      if (!importFromLink()) showGate();
    })();
    </script>
  </body>
</html>
